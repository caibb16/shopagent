services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: shopagent
      MYSQL_USER: shopagent
      MYSQL_PASSWORD: shopagentpw
    ports: ["3306:3306"]
    volumes:
      - ./src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/data-mysql.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DATABASE_URL: jdbc:mysql://mysql:3306/shopagent
      DATABASE_USER: shopagent
      DATABASE_PASSWORD: shopagentpw
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8080:8080"]
    restart: on-failure
