shopagent:
  llm:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    embedding-model: ${DEEPSEEK_EMBEDDING_MODEL:bge-small-zh}
  vector:
    backend: qdrant
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      collection: shopagent-kb
  session:
    summary-every-n-turns: 5
  redis:
    address: ${REDIS_ADDRESS:redis://localhost:6379}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/shopagent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DATABASE_USER:shopagent}
    password: ${DATABASE_PASSWORD:shopagent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      platform: mysql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      address: ${REDIS_ADDRESS:redis://localhost:6379}
