shopagent:
  llm:
    # dev profile: a non-empty placeholder so the manual ChatClient bean can be
    # constructed at boot without a real key. Override via DEEPSEEK_API_KEY when
    # exercising a real LLM locally.
    api-key: ${DEEPSEEK_API_KEY:dev-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    embedding-model: ${DEEPSEEK_EMBEDDING_MODEL:bge-small-zh}
  vector:
    backend: simple
  session:
    summary-every-n-turns: 5
